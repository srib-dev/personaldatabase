{% extends "base.html" %}

{% block tittel %}Dashboard{% endblock %}

{% block innhold %}
<style>
  .tabell-ramme { overflow-x: auto; border: 1px solid var(--kant); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--kant); }
  th { background: var(--flate); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .handlinger { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .knapp {
    padding: 0.4rem 0.8rem; border: 1px solid var(--kant); border-radius: 4px;
    background: var(--bakgrunn); color: inherit; font: inherit; cursor: pointer;
  }
  .knapp-fare { color: #b42318; }
  .status { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.875rem; background: var(--flate); }
  .status-aktiv { background: #e6f4ea; }
  .tomt { padding: 1.5rem; text-align: center; color: var(--tekst-dempet); }
</style>

<h1>Personal</h1>

<div class="tabell-ramme">
  <table>
    <thead>
      <tr>
        <th scope="col">Navn</th>
        <th scope="col">E-post</th>
        <th scope="col">Skole</th>
        <th scope="col">Avtale signert</th>
        <th scope="col">Status</th>
        <th scope="col">Handlinger</th>
      </tr>
    </thead>
    <tbody>
      {% for p in personer %}
        {% include "dashboard/_rad.html" %}
      {% else %}
        <tr><td colspan="6" class="tomt">Ingen personer registrert ennå.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
